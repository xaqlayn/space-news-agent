name: convert-screenshots
on: push
permissions:
  contents: write
jobs:
  convert:
    if: ${{ !contains(github.event.head_commit.message, '[converted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert HEIC screenshots to JPG and fix README image links
        run: |
          pip install -q pillow pillow-heif
          python - <<'EOF'
          from pillow_heif import register_heif_opener
          from PIL import Image
          import glob
          register_heif_opener()
          for f in glob.glob('*.HEIC'):
              im = Image.open(f)
              im.thumbnail((1800, 1800))
              im.convert('RGB').save(f[:-5] + '.jpg', quality=85)
          EOF
          git rm -q *.HEIC
          sed -i 's#https://github.com/xaqlayn/Space-development-updates-/blob/main/workflow-canvas.HEIC#workflow-canvas.jpg#; s#https://github.com/xaqlayn/Space-development-updates-/blob/main/email-output.PNG#email-output.PNG#' README.md
          sed -i '/(workflow-canvas.jpg)/a ![Workflow, part 2](workflow-canvas2.jpg)' README.md
          git config user.name "Saqlain Majeed"
          git config user.email "xaqlayn@users.noreply.github.com"
          git add -A
          git commit -m "Convert HEIC screenshots to JPG so they display on GitHub [converted]"
          git push
